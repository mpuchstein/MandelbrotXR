# MandelbrotXR candidates — the only hand-edited data file of the site build.
#
# One [[candidate]] table per top-level product folder. Fields:
#   slug          URL slug: candidates/<slug>/, play/<slug>/ (lowercase, a-z0-9 and '-')
#   folder        top-level repo folder <Vendor>-<Product>-<Model>-<Effort>-v<N>
#   name          longer descriptive name (kept in data/results.json and the search index)
#   label         display name used everywhere on the site, in tables and charts (folder names appear only on detail pages)
#   vendor        company
#   product       product / surface the chat ran in
#   model         model as recorded (TRANSCRIPTION.md header, ReviewOrchestrator/README.md §1)
#   effort        reasoning effort / mode as recorded
#   provenance    how model and effort were determined (README §1, verbatim where possible)
#   prompt        "v0" (prompt0.txt) or "v1" (prompt1.txt)
#   product_file  the product HTML file inside the folder
#   source_url    the original chat URL (TRANSCRIPTION.md header)
#   date          date of the chat (YYYY-MM-DD)
#   thumbnail     optional: repo path of the card picture, one of this candidate's review or judge
#                 screenshots (default: its first review screenshot)
#
# Dates: the Anthropic and OpenAI headers carry timestamps (2026-10-29). The Mistral,
# Gemini and Copilot headers carry no date; ReviewOrchestrator/README.md says all chats
# were collected on 2026-10-29, so that date is used for them.
#
# Thumbnails: the v0 browser reviews ran in a phone-sized portrait viewport, and the cards
# crop 16:10 from the top, which cuts off the landscape. Those two cards use a landscape
# judge screenshot instead.

